name: Build & Release

on:
  push:
    tags:
      - 'v*'   # Triggers on any tag starting with "v" (e.g., v1.0.0, v0.2.1)

permissions:
  contents: write  # Needed to create releases and upload assets

jobs:
  build:
    name: Build StarShade
    runs-on: macos-14  # Apple Silicon runner — matches arm64 target

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${TAG}"

      - name: Update version in Info.plist
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" Info.plist
          echo "Updated Info.plist to version ${VERSION}"

      - name: Build app bundle
        run: |
          set -euo pipefail

          BINARY_NAME="StarShade"

          # Compile Swift sources
          swiftc \
            -O \
            -target arm64-apple-macos14.0 \
            -framework Cocoa \
            -framework Metal \
            -framework MetalKit \
            -framework ScreenCaptureKit \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework IOSurface \
            -framework CoreImage \
            -framework QuartzCore \
            -o "${BINARY_NAME}" \
            main.swift \
            PresetConverter.swift

          # Create .app bundle
          mkdir -p StarShade.app/Contents/MacOS
          mkdir -p StarShade.app/Contents/Resources/Shaders

          cp "${BINARY_NAME}" StarShade.app/Contents/MacOS/
          cp Info.plist StarShade.app/Contents/Info.plist
          cp Shaders/*.metal StarShade.app/Contents/Resources/Shaders/

          # Ad-hoc sign (users can re-sign locally with their own cert)
          codesign --force --deep --sign - StarShade.app

          # Clean up loose binary
          rm -f "${BINARY_NAME}"

          echo "✅ Built StarShade.app"

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent StarShade.app "StarShade-${{ steps.version.outputs.tag }}-arm64.zip"
          echo "📦 Created StarShade-${{ steps.version.outputs.tag }}-arm64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StarShade v${{ steps.version.outputs.tag }}"
          body: |
            ## StarShade v${{ steps.version.outputs.tag }}

            ### Installation
            1. Download `StarShade-${{ steps.version.outputs.tag }}-arm64.zip` below
            2. Unzip and move `StarShade.app` to your Applications folder
            3. Right-click → Open (first time only, to bypass Gatekeeper)
            4. Grant Screen Recording permission when prompted

            ### Requirements
            - macOS 14.0+ (Sonoma)
            - Apple Silicon Mac (M1/M2/M3/M4)

            ### Hotkeys
            | Key | Action |
            |---|---|
            | Ctrl+Shift+Q | Emergency Quit |
            | Ctrl+Shift+R | Toggle overlay on/off |
            | Ctrl+Shift+[ | Previous shader |
            | Ctrl+Shift+] | Next shader |
            | Ctrl+Shift+↑ | Increase sharpness |
            | Ctrl+Shift+↓ | Decrease sharpness |
            | Ctrl+Shift+L | Reload shaders from disk |
          files: |
            StarShade-${{ steps.version.outputs.tag }}-arm64.zip
          draft: false
          prerelease: false
